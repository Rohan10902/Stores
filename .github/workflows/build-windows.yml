name: Build Store Data Assistant 7.1.5

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app.py"
      - "requirements.txt"
      - "core/**"
      - "qml/**"
      - ".github/workflows/build-windows.yml"
  push:
    branches: [main]
    paths:
      - "app.py"
      - "requirements.txt"
      - "core/**"
      - "qml/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    name: Validate and build Windows application
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify project structure
        shell: pwsh
        run: |
          $required = @(
            "app.py",
            "requirements.txt",
            "qml/Main.qml",
            "qml/pages/SingleReviewPage.qml",
            "qml/pages/CreateStorePage.qml",
            "core/common.py",
            "core/store_validator.py",
            "core/file_creator.py"
          )
          foreach ($path in $required) {
            if (!(Test-Path $path)) { throw "$path is missing" }
          }
          Write-Host "Project structure OK."

      - name: Check Python syntax
        shell: pwsh
        run: python -m compileall -q app.py core

      - name: Smoke-test core imports
        shell: pwsh
        run: |
          python -c "import core.common, core.store_validator, core.csv_repair, core.health, core.explorer, core.file_creator; print('Core imports OK')"

      - name: Build Store Data Assistant
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "StoreDataAssistant" `
            --add-data "qml;qml" `
            app.py

      - name: Verify Windows executable
        shell: pwsh
        run: |
          if (!(Test-Path "dist/StoreDataAssistant.exe")) {
            throw "StoreDataAssistant.exe was not created."
          }
          $file = Get-Item "dist/StoreDataAssistant.exe"
          Write-Host "Store Data Assistant 7.1.5 build complete"
          Write-Host "File:" $file.FullName
          Write-Host "Size:" $file.Length "bytes"

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: StoreDataAssistant-7.1.5-Windows
          path: dist/StoreDataAssistant.exe
          if-no-files-found: error
          retention-days: 30
