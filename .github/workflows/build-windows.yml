name: Build Store Data Assistant 7.2.1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app.py"
      - "requirements.txt"
      - "core/**"
      - "qml/**"
      - "tests/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    name: Test and package Windows desktop application
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify project structure
        shell: pwsh
        run: |
          $required = @("app.py","qml/Main.qml","qml/pages/SingleReviewPage.qml","qml/pages/CreateStorePage.qml","core/common.py","core/store_validator.py","core/file_creator.py","tests/test_production_core.py")
          foreach ($path in $required) { if (!(Test-Path $path)) { throw "$path is missing" } }

      - name: Check Python and regression tests
        shell: pwsh
        run: |
          python -m compileall -q app.py core tests
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Headless source startup test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          $p = Start-Process -FilePath "python" -ArgumentList "app.py" -PassThru -NoNewWindow
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "Source application exited during startup. Exit code: $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      # ONEDIR is intentional for 7.2.1. The previous ONEFILE build passed CI but
      # silently failed on a real Windows workstation before Python logging began.
      # ONEDIR avoids the bootloader's temporary self-extraction stage and makes
      # Qt DLL/plugin deployment visible and diagnosable.
      - name: Build production onedir application
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onedir `
            --windowed `
            --name "StoreDataAssistant" `
            --collect-all PySide6 `
            --collect-all shiboken6 `
            --hidden-import PySide6.QtQuickControls2 `
            --hidden-import PySide6.QtWidgets `
            --add-data "qml;qml" `
            app.py

      # A console build of the same application is shipped only as a diagnostic.
      # If the normal EXE ever fails, running this from Command Prompt exposes
      # import/Qt loader errors that a --windowed executable necessarily hides.
      - name: Build diagnostic console application
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onedir `
            --console `
            --name "StoreDataAssistant-Diagnostic" `
            --collect-all PySide6 `
            --collect-all shiboken6 `
            --hidden-import PySide6.QtQuickControls2 `
            --hidden-import PySide6.QtWidgets `
            --add-data "qml;qml" `
            app.py

      - name: Smoke-test packaged production EXE
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          $exe = (Resolve-Path "dist/StoreDataAssistant/StoreDataAssistant.exe").Path
          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "Packaged production EXE exited during startup. Exit code: $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Smoke-test diagnostic EXE
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          $exe = (Resolve-Path "dist/StoreDataAssistant-Diagnostic/StoreDataAssistant-Diagnostic.exe").Path
          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru -NoNewWindow
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "Diagnostic EXE exited during startup. Exit code: $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Create checksums and launch instructions
        shell: pwsh
        run: |
          $prod = "dist/StoreDataAssistant/StoreDataAssistant.exe"
          $diag = "dist/StoreDataAssistant-Diagnostic/StoreDataAssistant-Diagnostic.exe"
          (Get-FileHash $prod -Algorithm SHA256).Hash.ToLower() + "  StoreDataAssistant.exe" | Set-Content -Encoding ascii "dist/StoreDataAssistant/SHA256.txt"
          @"
          Store Data Assistant 7.2.1

          NORMAL USE
          1. Extract the entire StoreDataAssistant-7.2.1-Windows ZIP.
          2. Keep every extracted file/folder together.
          3. Open StoreDataAssistant\StoreDataAssistant.exe.

          IF IT DOES NOT OPEN
          Open StoreDataAssistant-Diagnostic\StoreDataAssistant-Diagnostic.exe.
          Keep the console window visible and capture the error text.

          Do not move only the EXE out of its folder; the ONEDIR build requires its bundled files.
          "@ | Set-Content -Encoding utf8 "dist/START-HERE.txt"

      - name: Upload Windows 7.2.1 candidate
        uses: actions/upload-artifact@v4
        with:
          name: StoreDataAssistant-7.2.1-Windows
          path: |
            dist/StoreDataAssistant/**
            dist/StoreDataAssistant-Diagnostic/**
            dist/START-HERE.txt
          if-no-files-found: error
          retention-days: 30
