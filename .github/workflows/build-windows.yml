name: validate-and-build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }
          pip install pyinstaller pytest pytest-benchmark psutil

      - name: Lint Source Code
        run: |
          # Add your specific linting command here (e.g., flake8 or pylint)
          echo "Linting complete."

      - name: Execute Test Suite
        run: |
          # Run tests if the directory exists
          if (Test-Path "tests") { python -m pytest tests/ } else { echo "No tests found, skipping." }

      - name: Build Windows Executable
        run: |
          # The crucial fix: --add-data "qml;qml" ensures the UI folder is bundled into the build
          pyinstaller --noconfirm --onedir --windowed --add-data "qml;qml" bootstrap.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StoreLens-Windows-Build
          # Uploads the final folder containing the executable and the _internal folder
          path: dist/bootstrap/
