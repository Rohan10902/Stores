name: Windows App Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8 pyinstaller pytest-benchmark

      - name: Lint Source Code
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 core/ tests/ app.py bootstrap.py --count --select=E9,F63,F7,F82 --show-source --statistics
          # Treat all other warnings as non-fatal
          flake8 core/ tests/ app.py bootstrap.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Execute Test Suite
        run: pytest tests/ -v

      - name: Build Windows Executable
        run: pyinstaller --noconfirm --clean --windowed app.py
        
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StoreLens-Windows-Build
          path: dist/app/
