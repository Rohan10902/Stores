name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Windows EXE
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --windowed --name StoreDataAssistant --add-data "Main.qml;." app.py

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: StoreDataAssistant-Windows
          path: dist/StoreDataAssistant.exe
