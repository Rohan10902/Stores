name: StoreLens Windows Release Candidate

on:
  push:
    branches: [main, master, production-hardening]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.21.0 pytest pytest-benchmark psutil ruff==0.16.0

      - name: Compile Python Source
        run: python -m compileall -q core app.py bootstrap.py

      - name: Python Correctness Lint
        run: ruff check . --select E9,F63,F7,F82

      - name: QML Lint
        shell: pwsh
        run: |
          $qmllint = Get-ChildItem "$env:pythonLocation\Lib\site-packages\PySide6" -Filter "qmllint.exe" -Recurse | Select-Object -First 1
          if (-not $qmllint) { throw "qmllint.exe was not found in the PySide6 installation." }
          $failed = $false
          Get-ChildItem qml -Filter *.qml -Recurse | ForEach-Object {
            & $qmllint.FullName -I qml $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { throw "QML lint failed." }

      - name: Execute Test Suite
        env:
          QT_QPA_PLATFORM: "offscreen"
          QT_QUICK_BACKEND: "software"
          QSG_RHI_BACKEND: "software"
          QT_OPENGL: "software"
        run: python -m pytest tests/ -v --tb=short

      - name: Python UI Startup Smoke Test
        shell: pwsh
        env:
          STORELENS_CI_STARTUP_TEST: "1"
          STORELENS_STARTUP_MARKER: "${{ github.workspace }}/source-startup.marker"
          QT_QPA_PLATFORM: "offscreen"
          QT_QUICK_BACKEND: "software"
          QSG_RHI_BACKEND: "software"
          QT_OPENGL: "software"
        run: |
          Remove-Item source-startup.marker -ErrorAction SilentlyContinue
          $output = & python bootstrap.py 2>&1
          $output | Tee-Object -FilePath source-startup.log
          if ($LASTEXITCODE -ne 0) { throw "Source startup smoke test failed." }
          if (-not (Test-Path source-startup.marker)) { throw "Source startup marker file was not created." }

      - name: Build Windows One-File Executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name StoreLens --version-file version_info.txt --add-data "qml;qml" bootstrap.py

      - name: Packaged One-File Startup Smoke Test
        shell: pwsh
        env:
          STORELENS_CI_STARTUP_TEST: "1"
          STORELENS_STARTUP_MARKER: "${{ github.workspace }}/packaged-startup.marker"
          QT_QPA_PLATFORM: "offscreen"
          QT_QUICK_BACKEND: "software"
          QSG_RHI_BACKEND: "software"
          QT_OPENGL: "software"
        run: |
          Remove-Item packaged-startup.marker -ErrorAction SilentlyContinue
          $exe = Resolve-Path "dist\StoreLens.exe"
          $out = Join-Path $PWD "packaged-startup.out"
          $err = Join-Path $PWD "packaged-startup.err"
          $process = Start-Process -FilePath $exe -Wait -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          Get-Content $out -ErrorAction SilentlyContinue
          Get-Content $err -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "Packaged one-file executable exited with code $($process.ExitCode)." }
          if (-not (Test-Path packaged-startup.marker)) { throw "Packaged one-file startup marker was not created." }

      - name: Generate SHA-256 Checksum
        shell: pwsh
        run: |
          Get-FileHash dist\StoreLens.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  StoreLens.exe" } | Set-Content dist\SHA256SUMS.txt

      - name: Upload Windows One-File Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StoreLens-Windows-OneFile
          path: |
            dist/StoreLens.exe
            dist/SHA256SUMS.txt
            packaged-startup.out
            packaged-startup.err
            packaged-startup.marker
