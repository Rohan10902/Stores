name: Build Store Data Assistant 7.2.1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app.py"
      - "requirements.txt"
      - "core/**"
      - "qml/**"
      - "tests/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    name: Test and package Windows desktop application
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify project structure
        shell: pwsh
        run: |
          $required = @("app.py","qml/Main.qml","qml/pages/SingleReviewPage.qml","qml/pages/CreateStorePage.qml","core/common.py","core/store_validator.py","core/file_creator.py","tests/test_production_core.py")
          foreach ($path in $required) { if (!(Test-Path $path)) { throw "$path is missing" } }

      - name: Check Python and regression tests
        shell: pwsh
        run: |
          python -m compileall -q app.py core tests
          python -c "import PySide6; import core.common, core.store_validator, core.csv_repair, core.health, core.explorer, core.file_creator; print('Imports OK')"
          python -m unittest discover -s tests -p "test_*.py" -v

      # GitHub-hosted Windows runners are non-interactive. A long-running GUI
      # assertion there is not a valid desktop-launch test and caused run #80
      # to fail before packaging. We validate source/imports/tests above, then
      # package both a normal desktop build and a console diagnostic build.
      - name: Build production onedir application
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onedir `
            --windowed `
            --name "StoreDataAssistant" `
            --collect-all PySide6 `
            --collect-all shiboken6 `
            --hidden-import PySide6.QtQuickControls2 `
            --hidden-import PySide6.QtWidgets `
            --add-data "qml;qml" `
            app.py

      - name: Build diagnostic console application
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onedir `
            --console `
            --name "StoreDataAssistant-Diagnostic" `
            --collect-all PySide6 `
            --collect-all shiboken6 `
            --hidden-import PySide6.QtQuickControls2 `
            --hidden-import PySide6.QtWidgets `
            --add-data "qml;qml" `
            app.py

      - name: Verify packaged runtime contents
        shell: pwsh
        run: |
          $prod = "dist/StoreDataAssistant"
          $diag = "dist/StoreDataAssistant-Diagnostic"
          if (!(Test-Path "$prod/StoreDataAssistant.exe")) { throw "Production EXE missing" }
          if (!(Test-Path "$diag/StoreDataAssistant-Diagnostic.exe")) { throw "Diagnostic EXE missing" }
          if (!(Test-Path "$prod/_internal/qml/Main.qml")) { throw "Bundled Main.qml missing from production package" }
          if (!(Test-Path "$diag/_internal/qml/Main.qml")) { throw "Bundled Main.qml missing from diagnostic package" }
          $prodSize = (Get-ChildItem $prod -Recurse -File | Measure-Object Length -Sum).Sum
          $diagSize = (Get-ChildItem $diag -Recurse -File | Measure-Object Length -Sum).Sum
          if ($prodSize -lt 10MB) { throw "Production package is unexpectedly small" }
          if ($diagSize -lt 10MB) { throw "Diagnostic package is unexpectedly small" }
          Write-Host "Production package bytes: $prodSize"
          Write-Host "Diagnostic package bytes: $diagSize"

      - name: Probe diagnostic executable
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          $exe = (Resolve-Path "dist/StoreDataAssistant-Diagnostic/StoreDataAssistant-Diagnostic.exe").Path
          $stdout = Join-Path $env:RUNNER_TEMP "sda-stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "sda-stderr.txt"
          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            Write-Host "--- stdout ---"
            if (Test-Path $stdout) { Get-Content $stdout }
            Write-Host "--- stderr ---"
            if (Test-Path $stderr) { Get-Content $stderr }
            Write-Warning "Headless diagnostic process exited with code $($p.ExitCode). This does not block packaging because hosted CI has no interactive Windows desktop. The console output above remains available for diagnosis."
          } else {
            Stop-Process -Id $p.Id -Force
            Write-Host "Diagnostic package survived the CI probe."
          }

      - name: Create checksums and launch instructions
        shell: pwsh
        run: |
          $prod = "dist/StoreDataAssistant/StoreDataAssistant.exe"
          $diag = "dist/StoreDataAssistant-Diagnostic/StoreDataAssistant-Diagnostic.exe"
          (Get-FileHash $prod -Algorithm SHA256).Hash.ToLower() + "  StoreDataAssistant.exe" | Set-Content -Encoding ascii "dist/StoreDataAssistant/SHA256.txt"
          (Get-FileHash $diag -Algorithm SHA256).Hash.ToLower() + "  StoreDataAssistant-Diagnostic.exe" | Set-Content -Encoding ascii "dist/StoreDataAssistant-Diagnostic/SHA256.txt"
          @"
          Store Data Assistant 7.2.1

          NORMAL USE
          1. Extract the ENTIRE ZIP before opening anything.
          2. Keep every extracted file and folder together.
          3. Open StoreDataAssistant\StoreDataAssistant.exe.
          4. Do not copy the EXE by itself to Desktop or another folder.

          IF THE NORMAL APP DOES NOT OPEN
          1. Open StoreDataAssistant-Diagnostic\StoreDataAssistant-Diagnostic.exe.
          2. A console window should appear.
          3. Send a screenshot of all text shown in that console.

          The diagnostic build contains the same application code but keeps the console visible so early Python, Qt, DLL, plugin, and QML errors cannot disappear silently.
          "@ | Set-Content -Encoding utf8 "dist/START-HERE.txt"

      - name: Upload Windows 7.2.1 candidate
        uses: actions/upload-artifact@v4
        with:
          name: StoreDataAssistant-7.2.1-Windows
          path: |
            dist/StoreDataAssistant/**
            dist/StoreDataAssistant-Diagnostic/**
            dist/START-HERE.txt
          if-no-files-found: error
          retention-days: 30
