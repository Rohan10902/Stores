name: Build Store Data Assistant 7.0

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "app.py"
      - "requirements.txt"
      - "core/**"
      - "qml/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    name: Build Windows Application
    runs-on: windows-latest

    steps:
      # ------------------------------------------------------------
      # 1. Download repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Install Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ------------------------------------------------------------
      # 3. Upgrade pip
      # ------------------------------------------------------------
      - name: Upgrade pip
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

      # ------------------------------------------------------------
      # 4. Install project dependencies
      # ------------------------------------------------------------
      - name: Install application dependencies
        shell: pwsh
        run: |
          pip install -r requirements.txt

      # ------------------------------------------------------------
      # 5. Install PyInstaller
      # ------------------------------------------------------------
      - name: Install PyInstaller
        shell: pwsh
        run: |
          pip install pyinstaller

      # ------------------------------------------------------------
      # 6. Verify important project files
      # Prevents wasting time building an incomplete upload.
      # ------------------------------------------------------------
      - name: Verify project structure
        shell: pwsh
        run: |
          Write-Host "Checking Store Data Assistant project..."

          if (!(Test-Path "app.py")) {
              throw "app.py is missing"
          }

          if (!(Test-Path "requirements.txt")) {
              throw "requirements.txt is missing"
          }

          if (!(Test-Path "qml")) {
              throw "qml folder is missing"
          }

          if (!(Test-Path "qml/Main.qml")) {
              throw "qml/Main.qml is missing"
          }

          if (!(Test-Path "core")) {
              throw "core folder is missing"
          }

          Write-Host "Project structure OK."

      # ------------------------------------------------------------
      # 7. Python syntax check
      # ------------------------------------------------------------
      - name: Check Python syntax
        shell: pwsh
        run: |
          python -m compileall app.py core

      # ------------------------------------------------------------
      # 8. Build Windows EXE
      #
      # --windowed is IMPORTANT.
      # It prevents the terminal/console window from opening.
      #
      # qml and core are bundled with the application.
      # ------------------------------------------------------------
      - name: Build Store Data Assistant
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "StoreDataAssistant" `
            --add-data "qml;qml" `
            app.py

      # ------------------------------------------------------------
      # 9. Verify EXE actually exists
      # ------------------------------------------------------------
      - name: Verify Windows executable
        shell: pwsh
        run: |
          if (!(Test-Path "dist/StoreDataAssistant.exe")) {
              throw "StoreDataAssistant.exe was not created."
          }

          $file = Get-Item "dist/StoreDataAssistant.exe"

          Write-Host "----------------------------------------"
          Write-Host "Store Data Assistant 7.0 build complete"
          Write-Host "----------------------------------------"
          Write-Host "File:" $file.FullName
          Write-Host "Size:" $file.Length "bytes"

      # ------------------------------------------------------------
      # 10. Upload EXE
      # ------------------------------------------------------------
      - name: Upload Store Data Assistant 7.0
        uses: actions/upload-artifact@v4
        with:
          name: StoreDataAssistant-7.0-Windows
          path: dist/StoreDataAssistant.exe
          if-no-files-found: error
          retention-days: 30
