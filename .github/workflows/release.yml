name: StoreLens Windows Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest ruff

      - name: Verify Version Tag
        shell: pwsh
        run: |
          $version = python -c "from core.version import APP_VERSION; print(APP_VERSION)"
          $tagVersion = "${env:GITHUB_REF_NAME}".Substring(1)
          if ($version -ne $tagVersion) { throw "Tag $tagVersion does not match application version $version." }

      - name: Validate Source
        shell: pwsh
        env:
          STORELENS_CI_STARTUP_TEST: "1"
          QT_QPA_PLATFORM: "offscreen"
        run: |
          python -m compileall -q core app.py bootstrap.py
          ruff check . --select E9,F63,F7,F82
          python -m pytest tests/ -v --tb=short
          $output = & python bootstrap.py 2>&1
          $output | Write-Output
          if ($LASTEXITCODE -ne 0 -or -not ($output -match "STORELENS_STARTUP_OK")) { throw "Source validation failed." }

      - name: Build Windows Package
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name StoreLens --version-file version_info.txt --add-data "qml;qml" bootstrap.py
          Compress-Archive -Path dist\StoreLens\* -DestinationPath dist\StoreLens-Windows.zip
          Get-FileHash dist\StoreLens-Windows.zip -Algorithm SHA256 | Format-List | Out-File dist\SHA256SUMS.txt

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${env:GITHUB_REF_NAME}" "dist\StoreLens-Windows.zip" "dist\SHA256SUMS.txt" --title "StoreLens ${env:GITHUB_REF_NAME}" --generate-notes
