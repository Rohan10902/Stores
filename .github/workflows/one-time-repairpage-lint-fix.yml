name: One-time RepairPage lint fixer

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: ${{ github.event.head_commit.message != 'chore: apply RepairPage qmllint fixes' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply targeted QML fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('qml/pages/RepairPage.qml')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '                            delegate: Rectangle {\n'
                  '                                required property var modelData\n'
                  '                                required property int index\n',
                  '                            delegate: Rectangle {\n'
                  '                                id: columnDelegate\n'
                  '                                required property var modelData\n'
                  '                                required property int index\n'
              ),
              (
                  '                                        root.selectedSourceColumn =\n'
                  '                                            index\n',
                  '                                        root.selectedSourceColumn =\n'
                  '                                            columnDelegate.index\n'
              ),
              (
                  '                                        root.selectedTargetColumn =\n'
                  '                                            modelData.column\n',
                  '                                        root.selectedTargetColumn =\n'
                  '                                            columnDelegate.modelData.column\n'
              ),
              (
                  '                                            root.selectedSourceColumn === index\n',
                  '                                            root.selectedSourceColumn === columnDelegate.index\n'
              ),
              (
                  '                                            modelData.column\n',
                  '                                            columnDelegate.modelData.column\n'
              ),
              (
                  '                                            modelData.value === ""\n'
                  '                                                ? "—"\n'
                  '                                                : modelData.value\n',
                  '                                            columnDelegate.modelData.value === ""\n'
                  '                                                ? "—"\n'
                  '                                                : columnDelegate.modelData.value\n'
              ),
              (
                  '                    text: parent.text\n'
                  '                    color: Theme.textPrimary\n'
                  '                    verticalAlignment: Text.AlignVCenter\n'
                  '                    leftPadding: parent.indicator.width + Theme.spacingSmall\n',
                  '                    text: rememberMapping.text\n'
                  '                    color: Theme.textPrimary\n'
                  '                    verticalAlignment: Text.AlignVCenter\n'
                  '                    leftPadding: rememberMapping.indicator.width + Theme.spacingSmall\n'
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit('Expected RepairPage pattern was not found')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          print('RepairPage.qml patched successfully')
          PY

      - name: Verify targeted patterns
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('qml/pages/RepairPage.qml').read_text(encoding='utf-8')
          forbidden = [
              'root.selectedSourceColumn =\n                                            index',
              'root.selectedTargetColumn =\n                                            modelData.column',
              'root.selectedSourceColumn === index',
              'text: parent.text',
              'leftPadding: parent.indicator.width',
          ]
          for item in forbidden:
              if item in text:
                  raise SystemExit(f'Unfixed pattern remains: {item!r}')
          print('RepairPage targeted lint patterns are clean')
          PY

      - name: Commit to main and remove this fixer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qml/pages/RepairPage.qml
          git rm .github/workflows/one-time-repairpage-lint-fix.yml
          git commit -m 'chore: apply RepairPage qmllint fixes'
          git push origin HEAD:main
