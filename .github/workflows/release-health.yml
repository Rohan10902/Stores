name: StoreLens Release Health

on:
  workflow_run:
    workflows:
      - StoreLens Production CI
      - StoreLens Windows Release Candidate
      - StoreLens Production Readiness Gate
      - StoreLens Security
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  health:
    name: Consolidated Release Health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate health report
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report
          gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" > report/runs.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('report/runs.json').read_text())
          runs = data.get('workflow_runs', [])
          names = {
              'StoreLens Production CI',
              'StoreLens Windows Release Candidate',
              'StoreLens Production Readiness Gate',
              'StoreLens Security',
          }
          rows = []
          for name in sorted(names):
              matching = [r for r in runs if r.get('name') == name]
              latest = max(matching, key=lambda r: r.get('run_number', 0)) if matching else None
              rows.append((name, latest.get('status'), latest.get('conclusion')) if latest else (name, 'missing', 'missing'))
          lines = ['# StoreLens Release Health', '', f'Commit: {__import__("os").environ["SHA"]}', '', '| Gate | Status | Conclusion |', '|---|---|---|']
          for name, status, conclusion in rows:
              lines.append(f'| {name} | {status} | {conclusion} |')
          Path('report/STORELENS_RELEASE_HEALTH.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(Path('report/STORELENS_RELEASE_HEALTH.md').read_text())
          if any(conclusion == 'failure' for _, _, conclusion in rows):
              raise SystemExit('At least one production gate failed.')

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StoreLens-Release-Health
          path: report/
