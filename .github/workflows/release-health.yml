name: StoreLens Release Health

on:
  workflow_run:
    workflows:
      - StoreLens Production CI
      - StoreLens Windows Release Candidate
      - StoreLens Production Readiness Gate
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  health:
    name: Consolidated Release Health
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate health report
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report
          gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" > report/runs.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path('report/runs.json').read_text())
          runs = data.get('workflow_runs', [])
          names = {
              'StoreLens Production CI',
              'StoreLens Windows Release Candidate',
              'StoreLens Production Readiness Gate',
          }
          rows = []
          for name in sorted(names):
              matching = [r for r in runs if r.get('name') == name]
              latest = max(matching, key=lambda r: r.get('run_number', 0)) if matching else None
              rows.append((name, latest.get('status'), latest.get('conclusion')) if latest else (name, 'missing', 'pending'))

          lines = [
              '# StoreLens Release Health',
              '',
              f"Commit: {os.environ['SHA']}",
              '',
              '| Gate | Status | Conclusion |',
              '|---|---|---|',
          ]
          for name, status, conclusion in rows:
              lines.append(f'| {name} | {status} | {conclusion} |')
          report = '\n'.join(lines) + '\n'
          Path('report/STORELENS_RELEASE_HEALTH.md').write_text(report, encoding='utf-8')
          print(report)

          # This workflow is a reporter, not the release gate. The actual
          # Production Readiness Gate is responsible for blocking releases.
          # Missing gates are expected when this workflow is triggered by the
          # first of several independent workflow_run completions.
          PY

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: StoreLens-Release-Health
          path: report/
