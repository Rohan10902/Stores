name: StoreLens Production CI

on:
  push:
    branches: [main, master, production-hardening]
  pull_request:
    branches: [main, master]

jobs:
  rigorous-test-suite:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Dependencies and Test Tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-benchmark psutil ruff==0.16.0

      - name: Compile Python Source
        run: python -m compileall -q core app.py bootstrap.py

      - name: Ruff Correctness Lint
        run: ruff check . --select E9,F63,F7,F82

      - name: QML Lint
        shell: pwsh
        run: |
          $qmllint = Get-ChildItem "$env:pythonLocation\Lib\site-packages\PySide6" -Filter "qmllint.exe" -Recurse | Select-Object -First 1
          if (-not $qmllint) { throw "qmllint.exe was not found in the PySide6 installation." }
          $failed = $false
          Get-ChildItem qml -Filter *.qml -Recurse | ForEach-Object {
            & $qmllint.FullName -I qml $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { throw "QML lint failed." }

      - name: Execute Full Test Suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: "offscreen"
          QT_QUICK_BACKEND: "software"
          QSG_RHI_BACKEND: "software"
          QT_OPENGL: "software"
        run: |
          python -m pytest tests/ -v --tb=short --junitxml=test-results.xml 2>&1 | Tee-Object -FilePath pytest-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: StoreLens Feature Acceptance Gate
        shell: pwsh
        env:
          QT_QPA_PLATFORM: "offscreen"
          QT_QUICK_BACKEND: "software"
          QSG_RHI_BACKEND: "software"
          QT_OPENGL: "software"
        run: |
          python -m pytest tests/test_workflow_acceptance.py tests/test_qml_feature_acceptance.py -v --tb=short --junitxml=feature-acceptance-results.xml 2>&1 | Tee-Object -FilePath feature-acceptance-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Test Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StoreLens-Test-Diagnostics
          path: |
            pytest-output.txt
            test-results.xml
            feature-acceptance-output.txt
            feature-acceptance-results.xml

      - name: Application Startup Smoke Test
        shell: pwsh
        env:
          STORELENS_CI_STARTUP_TEST: "1"
          STORELENS_STARTUP_MARKER: "${{ github.workspace }}/startup-smoke.marker"
          QT_QPA_PLATFORM: "offscreen"
          QT_QUICK_BACKEND: "software"
          QSG_RHI_BACKEND: "software"
          QT_OPENGL: "software"
        run: |
          Remove-Item startup-smoke.marker -ErrorAction SilentlyContinue
          $output = & python bootstrap.py 2>&1
          $output | Tee-Object -FilePath startup-smoke.log
          if ($LASTEXITCODE -ne 0) { throw "Application startup smoke test failed." }
          if (-not (Test-Path startup-smoke.marker)) { throw "Startup marker file was not created." }
