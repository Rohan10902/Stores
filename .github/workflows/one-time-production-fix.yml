name: StoreLens One-Time Production Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Apply safe runtime fixes
        shell: python
        run: |
          from pathlib import Path

          create = Path("qml/pages/CreateStorePage.qml")
          text = create.read_text(encoding="utf-8")
          old = 'required property string modelData\n                            width: 155'
          new = 'required property string modelData\n                            required property int index\n                            width: 155'
          if old in text and 'required property int index\n                            width: 155' not in text:
              text = text.replace(old, new, 1)
              create.write_text(text, encoding="utf-8")

          repair = Path("qml/pages/RepairPage.qml")
          text = repair.read_text(encoding="utf-8")
          old = 'function showIssue(i){selected=i;mappingMode=false;newRecordMode=false;preview.clear();if(i<0||i>=issues.count)return;var c=JSON.parse(issues.get(i).columnsJson);'
          new = 'function showIssue(i){selected=i;mappingMode=false;newRecordMode=false;preview.clear();if(i<0||i>=issues.count){selected=-1;return;}var issue=issues.get(i);var c=JSON.parse(issue.columnsJson||"[]");'
          if old in text:
              text = text.replace(old, new, 1)
              repair.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/build-windows.yml")
          text = workflow.read_text(encoding="utf-8")
          old = '          if($LASTEXITCODE -ne 0){Get-Content source-startup.log;throw "Source startup failed: $LASTEXITCODE"}\n'
          new = old + '          $runtimeErrors = Select-String -Path source-startup.log -Pattern "ReferenceError|TypeError|SyntaxError" -SimpleMatch:$false\n          if($runtimeErrors){Get-Content source-startup.log;throw "Source startup emitted runtime errors."}\n          if(-not (Select-String -Path source-startup.log -Pattern "STORELENS_STARTUP_OK" -Quiet)){Get-Content source-startup.log;throw "Startup success marker missing."}\n'
          if old in text and 'Source startup emitted runtime errors.' not in text:
              text = text.replace(old, new, 1)

          old = '          if($p.ExitCode -ne 0){throw "Packaged startup failed: $($p.ExitCode)"}\n'
          new = '          if($p.ExitCode -ne 0){throw "Packaged startup failed: $($p.ExitCode)"}\n          $runtimeErrors = @()\n          if(Test-Path packaged-out.log){$runtimeErrors += Select-String -Path packaged-out.log -Pattern "ReferenceError|TypeError|SyntaxError" -SimpleMatch:$false}\n          if(Test-Path packaged-err.log){$runtimeErrors += Select-String -Path packaged-err.log -Pattern "ReferenceError|TypeError|SyntaxError" -SimpleMatch:$false}\n          if($runtimeErrors){throw "Packaged startup emitted runtime errors."}\n'
          if old in text and 'Packaged startup emitted runtime errors.' not in text:
              text = text.replace(old, new, 1)
          workflow.write_text(text, encoding="utf-8")

      - name: Verify expected changes
        shell: bash
        run: |
          grep -q 'required property int index' qml/pages/CreateStorePage.qml
          grep -q 'var issue=issues.get(i)' qml/pages/RepairPage.qml
          grep -q 'Source startup emitted runtime errors.' .github/workflows/build-windows.yml

      - name: Commit fixes to main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qml/pages/CreateStorePage.qml qml/pages/RepairPage.qml .github/workflows/build-windows.yml
          if git diff --cached --quiet; then
            echo "No changes required."
          else
            git commit -m "Fix QML runtime errors and harden startup verification"
            git push origin HEAD:main
          fi

      - name: Remove one-time fixer
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          if [ -f .github/workflows/one-time-production-fix.yml ]; then
            git rm .github/workflows/one-time-production-fix.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Remove one-time production fixer"
            git push origin HEAD:main
          fi
